; Per-project PHP overrides (honoured by PHP-FPM / FastCGI, e.g. Laravel Herd).
; The onboarding + profile forms accept profile photos up to 5 MB (max:5120),
; so the PHP upload limits must comfortably exceed that or the file is silently
; dropped (or the whole request is rejected with a 413 before it reaches PHP).
upload_max_filesize = 12M
post_max_size = 16M
